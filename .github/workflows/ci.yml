name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build-and-test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: scripts/package-lock.json

      - name: Install
        working-directory: scripts
        run: npm ci

      - name: Typecheck
        working-directory: scripts
        run: npm run typecheck

      - name: Rebuild generated output
        working-directory: scripts
        run: npm run build

      # The generator must warn-and-skip nothing, and the committed AGENTS.md / SKILL.md
      # marker sections must match a fresh build. Any drift fails here.
      - name: Verify generated output is committed and current
        run: |
          if [ -n "$(git status --porcelain)" ]; then
            echo "Generated output is stale or uncommitted. Run: cd scripts && npm run build"
            git --no-pager diff
            exit 1
          fi

      - name: Test
        working-directory: scripts
        run: npm test
